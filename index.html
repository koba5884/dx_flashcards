    <style>

            height: 100%;

            border-radius: 20px;
            padding: 40px;

            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-front {
            background: white;
        }

        .card-back {
            background: #f8f9fa;
            transform: rotateY(180deg);
        }

        .card-category {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

            right: 20px;

            text-align: center;

            font-size: 1.3em;

            font-weight: 500;
        }

            color: #555;

        }

        .search-button-container {
            padding-top: 15px;

            width: 100%;
            display: flex;
            justify-content: center;
        }

        .search-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            padding: 10px 20px;

            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;

        button {

        .progress-fill {

            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(102,126,234,0.5);

<body>
    <div class="container">
        <div class="header">
            <h1>デジタル社会・DX フラッシュカード</h1>
            <div class="stats">
                <div class="stat-item">全<span id="total-cards">100</span>問</div>
                <div class="stat-item">進捗: <span id="current-card">1</span>問目</div>
                <div class="stat-item">カテゴリ: <span id="current-category">全て</span></div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCategory('all')">全て</button>
            <button class="filter-btn" onclick="filterCategory('デジタル社会・行政DX')">デジタル社会</button>
            <button class="filter-btn" onclick="filterCategory('データ活用・法制度')">データ・法制度</button>
            <button class="filter-btn" onclick="filterCategory('ビジネス・DXフレームワーク')">ビジネス・DX</button>
            <button class="filter-btn" onclick="filterCategory('準公共分野DX')">準公共DX</button>
            <button class="filter-btn" onclick="filterCategory('情報セキュリティ')">セキュリティ</button>
        </div>

        <div class="card-container">
            <div class="card" id="flashcard" onclick="flipCard(event)">
                <div class="card-face card-front">
                    <div class="card-category" id="category-front"></div>
                    <div class="card-number" id="card-number-front"></div>
                    <div class="card-content" id="question"></div>
                    <div class="flip-hint">クリックして答えを表示</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-category" id="category-back"></div>
                    <div class="card-number" id="card-number-back"></div>
                    <div class="card-content" id="answer"></div>
                    <div class="search-button-container">
                        <a id="search-link" class="search-button" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                            詳しく調べる
                        </a>
                    </div>
                    <div class="flip-hint">クリックして問題に戻る</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="previousCard()">← 前へ</button>
            <button class="primary" onclick="randomCard()">ランダム</button>
            <button onclick="nextCard()">次へ →</button>
        </div>
    </div>

    <script>
        const flashcards = [
            // デジタル社会と行政DX (17問)
            {category: "デジタル社会・行政DX", question: "デジタル庁が創設された背景として、新型コロナウイルス対応で明らかになった課題のうち、行政の非効率を招いた一因は何ですか。", answer: "国、自治体のデジタル化の遅れや人材不足、不十分なシステム連携です。", searchKeywords: "デジタル庁 創設 背景 新型コロナ"},
            {category: "デジタル社会・行政DX", question: "デジタル庁の創設により、かねてより指摘されてきた課題を根本的に解決するため、行政の縦割りを打破し、断行を目指すものは何ですか。", answer: "規制改革です。", searchKeywords: "デジタル庁 規制改革 縦割り打破"},
            {category: "デジタル社会・行政DX", question: "デジタル社会の実現に向けて掲げられた、「誰一人取り残されない、人に優しいデジタル化」の目指すビジョンとは何ですか。", answer: "一人ひとりのニーズに合ったサービスを選ぶことができ、多様な幸せが実現できる社会です。", searchKeywords: "デジタル社会 ビジョン 誰一人取り残されない"},
            {category: "デジタル社会・行政DX", question: "デジタル社会を形成するための基本原則として掲げられた10原則のうち、「継続・安定・強靭」の原則において、社会の活力維持・向上のほかに確保すべきこととされているものは何ですか。", answer: "環境との共生を通じたサステナビリティ確保や、機器故障・事故等のリスクに備えた冗長性確保です。", searchKeywords: "デジタル社会 10原則 継続安定強靭"},
            {category: "デジタル社会・行政DX", question: "令和3年5月に成立・公布され、従来のIT基本法を廃止してデジタル社会の形成の基本的枠組みを定めた法律は何ですか。", answer: "デジタル社会形成基本法です。", searchKeywords: "デジタル社会形成基本法 IT基本法"},
            {category: "デジタル社会・行政DX", question: "デジタル社会の形成に関する「司令塔」として、行政の縦割りを打破し、行政サービスを抜本的に向上させるため、デジタル庁に与えられた機能は何ですか。", answer: "強力な総合調整機能（勧告権等）です。", searchKeywords: "デジタル庁 総合調整機能 勧告権"},
            {category: "デジタル社会・行政DX", question: "国民に対する行政サービスのデジタル化の推進において、マイナンバーカードの活用の促進策として推進されている具体的な取り組みを2つ挙げてください。", answer: "健康保険証としての利用推進、運転免許証・在留カードとの一体化推進、または電子証明書のスマートフォン搭載などです。", searchKeywords: "マイナンバーカード 健康保険証 運転免許証一体化"},
            {category: "デジタル社会・行政DX", question: "新型コロナ対策など緊急時の給付や事務処理の迅速化を実現するため、マイナンバーカードを利用して早期に登録が開始される制度は何ですか。", answer: "公金受取口座の登録・利用の推進です。", searchKeywords: "公金受取口座 マイナンバーカード"},
            {category: "デジタル社会・行政DX", question: "地方公共団体の情報システムの統一・標準化について、原則全ての地方公共団体が標準化基準に適合したシステムへ移行する目標時期は何ですか。", answer: "令和7年度（2025年度）までです。", searchKeywords: "地方公共団体 システム標準化 2025年度"},
            {category: "デジタル社会・行政DX", question: "地方公共団体の基幹業務システムの統一・標準化が目指す姿として、複数の民間事業者による競争環境を確保し、回避すべき弊害とされているものは何ですか。", answer: "ベンダーロックインです。", searchKeywords: "ベンダーロックイン 地方自治体システム"},
            {category: "デジタル社会・行政DX", question: "デジタル社会形成整備法に基づき、官民や地域の枠を超えたデータ利活用の推進のため、地方公共団体の制度についても全国的な共通ルールが設定された対象となる法律は何ですか。", answer: "個人情報関係３法（個人情報保護法改正等）です。", searchKeywords: "個人情報保護法 デジタル社会形成整備法"},
            {category: "デジタル社会・行政DX", question: "デジタル手続法において基本原則として明確化された、行政のあらゆるサービスを一貫してデジタルで完結させるために不可欠な3原則を何と総称しますか。", answer: "デジタル3原則（デジタルファースト、ワンスオンリー、コネクテッド・ワンストップ）です。", searchKeywords: "デジタル3原則 デジタルファースト ワンスオンリー"},
            {category: "デジタル社会・行政DX", question: "健康・医療・介護、教育、防災、こども等の国民生活に密接に関連し、国と民間が協働して支えている分野として指定されているものは何ですか。", answer: "準公共分野です。", searchKeywords: "準公共分野 デジタル化"},
            {category: "デジタル社会・行政DX", question: "デジタル臨時行政調査会が策定した構造改革のための「デジタル原則」5原則のうち、IDやベース・レジストリ等について、国・地方・準公共といった縦割りではなく官民で広く共通基盤を利用することを定めた原則は何ですか。", answer: "共通基盤利用原則です。", searchKeywords: "デジタル原則 共通基盤利用原則"},
            {category: "デジタル社会・行政DX", question: "人、法人、土地、建物、資格等の社会の基本データであり、正確性や最新性が確保された社会の基盤となるデータベースを何と呼びますか。", answer: "ベース・レジストリです。", searchKeywords: "ベースレジストリ 基盤データベース"},
            {category: "デジタル社会・行政DX", question: "DXアドバイザー検定がDX推進の段階として位置づけている「紙媒体、アナログ情報のデジタル化」を指す最初のフェーズは何ですか。", answer: "デジタイゼーションです。", searchKeywords: "デジタイゼーション デジタライゼーション DX"},
            {category: "デジタル社会・行政DX", question: "経営者や社内関係者がDX推進に向けた現状や課題認識を共有し、アクションにつなげるための「気づきの機会」を提供する指標は何ですか。", answer: "DX推進指標です。", searchKeywords: "DX推進指標 経済産業省"},

            // データ活用と法制度 (17問)
            {category: "データ活用・法制度", question: "日本国内の全住民に指定・通知されている12桁の番号で、その利用が「社会保障・税・災害対策」分野の事務の手続に限定されているものは何ですか。", answer: "マイナンバー（個人番号）です。", searchKeywords: "マイナンバー 個人番号 制度"},
            {category: "データ活用・法制度", question: "マイナンバー制度における個人情報の管理方法は、特定の機関に情報を集約する「一元管理」ではなく、従来どおり各行政機関等が保有し、必要な場合に情報提供ネットワークシステムを使って照会・提供を行う何という方法ですか。", answer: "分散管理です。", searchKeywords: "マイナンバー 分散管理 情報提供ネットワーク"},
            {category: "データ活用・法制度", question: "特定個人情報（マイナンバーを含む個人情報）について、法令で限定されている利用範囲は何ですか。", answer: "税・社会保障・災害対策です。", searchKeywords: "特定個人情報 マイナンバー 利用範囲"},
            {category: "データ活用・法制度", question: "マイナンバーカードに搭載されており、マイナンバーを使わずに電子的に個人を認証する機能は何ですか。", answer: "電子証明書（公的個人認証の機能）です。", searchKeywords: "電子証明書 公的個人認証 マイナンバーカード"},
            {category: "データ活用・法制度", question: "特定個人情報の取扱いに関して、個人情報保護法と番号法に異なる定めがある場合、どちらの規定が優先的に適用されますか。", answer: "番号法（番号法に特則が定められていない場合は個人情報保護法の規定が適用されます）。", searchKeywords: "番号法 個人情報保護法 特定個人情報"},
            {category: "データ活用・法制度", question: "特定個人情報ではない個人データについて、利用する必要がなくなった場合、事業者は「遅滞なく消去するよう努めなければならない」とされていますが、特定個人情報の場合はどう定められていますか。", answer: "不要となった特定個人情報は、法令で決められた保存期間を経過すれば、廃棄又は削除しなければなりません。", searchKeywords: "特定個人情報 廃棄 削除義務"},
            {category: "データ活用・法制度", question: "令和2年改正個人情報保護法により、保有個人データの開示方法について、本人が指示できるようになった提供方法（現行の書面交付に加え）は何ですか。", answer: "電磁的記録の提供です。", searchKeywords: "個人情報保護法 令和2年改正 電磁的記録"},
            {category: "データ活用・法制度", question: "令和2年改正個人情報保護法により、個人データの漏えい等が発生した場合に、個人情報保護委員会への報告及び本人への通知が義務化される「個人の権利利益を害するおそれが大きい場合」として、要配慮個人情報が漏えいした場合の他に該当する類型を2つ挙げてください。", answer: "不正アクセス（不正の目的をもって行われたおそれがある場合）、一定数（100人超）以上の個人データの漏えい等、または財産的被害が生じるおそれがある個人データの漏えい等です。", searchKeywords: "個人データ 漏えい 報告義務"},
            {category: "データ活用・法制度", question: "イノベーション促進の観点から、氏名等を削除し、内部分析に限定することを条件に、開示・利用停止請求への対応等の義務が緩和されることとなった、令和2年改正個人情報保護法で創設された情報は何ですか。", answer: "仮名加工情報です。", searchKeywords: "仮名加工情報 個人情報保護法"},
            {category: "データ活用・法制度", question: "仮名加工情報として取り扱うことで、通常の個人情報（個人データ）に適用される義務のうち、適用が除外される主なもの（3つ）は何ですか。", answer: "漏えい等の報告義務、開示・利用停止等の請求対応（本人からの）、利用目的の変更の制限です。", searchKeywords: "仮名加工情報 義務 除外"},
            {category: "データ活用・法制度", question: "提供元では個人データに該当しないものの、提供先において個人データとなることが想定される情報（個人関連情報）を第三者に提供する際に、提供元事業者に義務付けられた措置は何ですか。", answer: "提供先において本人の同意が得られていること等の確認です。", searchKeywords: "個人関連情報 第三者提供 同意確認"},
            {category: "データ活用・法制度", question: "特定の個人との対応関係が排斥されている限り、「個人に関する情報」にも「個人情報」にも該当しないと考えられる情報のうち、複数人の個人情報を機械学習の学習用データセットとして用いて生成した係数は何ですか。", answer: "学習済みパラメータ（重み係数）です。", searchKeywords: "学習済みパラメータ 機械学習 個人情報"},
            {category: "データ活用・法制度", question: "特定の個人情報を検索できるように体系的に構成されていないため、原則として個人情報データベース等に該当しないと解される記録を一つ挙げてください。", answer: "防犯カメラやビデオカメラなどで記録された映像情報（特定の個人に係る映像情報について検索ができない場合）です。", searchKeywords: "個人情報データベース 防犯カメラ 映像情報"},
            {category: "データ活用・法制度", question: "要配慮個人情報を取得する場合、原則としてあらかじめ本人の同意が必要ですが、法令に基づく場合や生命・身体・財産の保護のために必要で本人の同意を得るのが困難な場合以外に、学術研究機関等が学術研究目的で取り扱う場合に、取得制限の例外が適用されることがありますか。", answer: "はい。個人の権利利益を不当に侵害するおそれがある場合を除き、例外規定が設けられています。", searchKeywords: "要配慮個人情報 学術研究 例外規定"},
            {category: "データ活用・法制度", question: "過去に販売した製品の不具合による人命に関わる事故のおそれがあり、製造会社が至急製品を回収するために、販売会社から購入者情報を取得する必要がある場合、本人の同意なしに情報提供できますか。", answer: "はい。生命、身体又は財産の保護のために必要で、本人の同意を得ることが困難であるときに該当する可能性が高いです。", searchKeywords: "個人情報 第三者提供 生命身体財産保護"},
            {category: "データ活用・法制度", question: "個人情報から作成した「統計情報」と「匿名加工情報」の最も重要な違いは何ですか。", answer: "統計情報は個人情報に該当しませんが、匿名加工情報は個人情報保護法の規制（識別行為の禁止など）が適用される点です。", searchKeywords: "統計情報 匿名加工情報 違い"},
            {category: "データ活用・法制度", question: "個人情報取扱事業者は、保有個人データの安全管理のために講じた措置について、どのような対応が義務付けられていますか。", answer: "原則として、安全管理のために講じた措置の概要及び問い合わせ窓口を公表すること、または本人の求めに応じて遅滞なく回答することが義務化されています。", searchKeywords: "安全管理措置 公表義務 個人情報"},

            // ビジネスとDXフレームワーク (17問)
            {category: "ビジネス・DXフレームワーク", question: "DX（デジタルトランスフォーメーション）の定義を、企業が競争上の優位性を確立するために変革する対象を含めて説明してください。", answer: "企業がビジネス環境の激しい変化に対応し、データとデジタル技術を活用して、顧客や社会のニーズを基に、製品やサービス、ビジネスモデルを変革するとともに、業務そのものや、組織、プロセス、企業文化・風土を変革し、競争上の優位性を確立することです。", searchKeywords: "DX デジタルトランスフォーメーション 定義"},
            {category: "ビジネス・DXフレームワーク", question: "経済産業省が策定したDX推進指標の主な狙いは何ですか。", answer: "経営者や社内の関係者が、自社のDX取組の現状や課題、取るべきアクションについて認識を共有し、アクションにつなげるための「気づきの機会を提供すること」です。", searchKeywords: "DX推進指標 経済産業省"},
            {category: "ビジネス・DXフレームワーク", question: "DX推進指標の構成要素を、大きく2つの柱（経営のあり方、ITシステム構築）とそれぞれの定性/定量指標に分けて答えてください。", answer: "2つの柱は「DX推進のための経営のあり方、仕組み」と「DXを実現する上で基盤となるITシステムの構築」です。それぞれ、「DX推進の枠組み（定性指標）」「DX推進の取組状況（定量指標）」、および「ITシステム構築の枠組み（定性指標）」「ITシステム構築の取組状況（定量指標）」で構成されます。", searchKeywords: "DX推進指標 構成要素 定性指標"},
            {category: "ビジネス・DXフレームワーク", question: "DX推進指標の定性指標において、成熟度は何段階で評価されますか。また、最終的なゴールであるレベル5はどのような状態を指しますか。", answer: "6段階で評価されます。最終的なゴール（レベル5）は「デジタル企業として、グローバル競争を勝ち抜くことのできるレベル」です。", searchKeywords: "DX推進指標 成熟度 レベル5"},
            {category: "ビジネス・DXフレームワーク", question: "企業価値の向上につながるDX経営を実行するにあたり、デジタルガバナンス・コードが経営者に意識するよう求めている「3つの視点」をすべて挙げてください。", answer: "①経営ビジョンとDX戦略の連動、②As is - To be ギャップの定量把握・見直し、③企業文化への定着の3つです。", searchKeywords: "デジタルガバナンスコード 3つの視点"},
            {category: "ビジネス・DXフレームワーク", question: "デジタルガバナンス・コードが定めるDX経営に求められる「5つの柱」を挙げてください。また、各柱が構成される2つの区分は何ですか。", answer: "5つの柱は、1.経営ビジョン・ビジネスモデルの策定、2.DX戦略の策定、3.DX戦略の推進、4.成果指標の設定・DX戦略の見直し、5.ステークホルダーとの対話です。各柱は「（１）基本的事項」と「（２）望ましい方向性」で構成されます。", searchKeywords: "デジタルガバナンスコード 5つの柱"},
            {category: "ビジネス・DXフレームワーク", question: "BABOK®とは何の略で、どのような目的の知識体系ガイドですか。また、発行元の組織名を答えてください。", answer: "BABOK®は「ビジネスアナリシス知識体系ガイド（A Guide to the Business Analysis Body of Knowledge）」の略で、ビジネスアナリシス（BA）の知識体系ガイドです。発行元は、カナダのトロントに本拠を置くNPO法人 International Institute of Business Analysis (IIBA) です。", searchKeywords: "BABOK ビジネスアナリシス IIBA"},
            {category: "ビジネス・DXフレームワーク", question: "『BABOK® Version 2.0』では、知識体系はいくつに分類され、また、タスクはいくつ定義されていますか。", answer: "7つの知識エリアと、32のタスクが定義されています。", searchKeywords: "BABOK 知識エリア タスク"},
            {category: "ビジネス・DXフレームワーク", question: "BABOK®の理解において重要な「主要なコンセプト」は6つあります。そのうち3つを挙げてください。", answer: "「チェンジ」「ニーズ」「ソリューション」「ステークホルダー」「価値」「コンテキスト」の中から3つです。", searchKeywords: "BABOK 主要コンセプト"},
            {category: "ビジネス・DXフレームワーク", question: "ビジネスモデルキャンバス（BMC）は、事業の全体像を把握するために、いくつの構成要素（ブロック）でビジネスモデルを表現するフレームワークですか。", answer: "9つの構成要素（ブロック）で表現するフレームワークです。", searchKeywords: "ビジネスモデルキャンバス BMC 9ブロック"},
            {category: "ビジネス・DXフレームワーク", question: "ビジネスモデルキャンバス（BMC）を構成する9つの要素のうち、任意の3つを挙げ、それぞれがどのような内容を記述するものかを簡潔に説明してください。", answer: "（例）顧客セグメント：誰が製品やサービスを必要としているか（具体的な顧客像）、価値提案：顧客の何を解決し、どんな価値を提供するのか（差別化ポイント）、主要活動：価値提案を実現するために必要な重要な活動。", searchKeywords: "ビジネスモデルキャンバス 9要素"},
            {category: "ビジネス・DXフレームワーク", question: "ビジネスモデルキャンバス（BMC）を作成する際の推奨される主な思考順序（4つのステップ）を答えてください。", answer: "①「価値（パーパス）」の確認、②「マーケティング（顧客）」の策定、③「バリューチェーン」の設計、④「収支計算（事業の成立確認）」の順です。", searchKeywords: "ビジネスモデルキャンバス 思考順序"},
            {category: "ビジネス・DXフレームワーク", question: "「DXアドバイザー検定」がDX推進を位置づけている、段階的な3つのフェーズを順に答えてください。", answer: "デジタイゼーション（紙媒体、アナログ情報のデジタル化）、デジタライゼーション（既存業務プロセスの再構築、新商品・サービスの開発）、デジタルトランスフォーメーション（ビジネスモデルの変革、持続可能性のある仕組みの構築）です。", searchKeywords: "デジタイゼーション デジタライゼーション DX 3段階"},
            {category: "ビジネス・DXフレームワーク", question: "「DXアドバイザー検定（スペシャリスト）」の試験対象となる4つの知識・スキル領域をすべて挙げてください。", answer: "「ITリテラシー」「DXリテラシー」「ビジネスアナリシス」「情報マネジメント（個人情報保護など）」の4つです。", searchKeywords: "DXアドバイザー検定 スペシャリスト"},
            {category: "ビジネス・DXフレームワーク", question: "DX推進の文脈で使われる「技術的負債」（レガシーシステム）とは、具体的にどのような状態を指しますか。", answer: "短期的な観点でシステムを開発し、結果として、長期的に保守費や運用費が高騰している状態のことです。", searchKeywords: "技術的負債 レガシーシステム DX"},
            {category: "ビジネス・DXフレームワーク", question: "中堅・中小企業がDXに取り組む上で、特に課題として挙げられることが多いものを3つ挙げてください。", answer: "（例）「ITに関わる人材が足りない」、「DX推進に関わる人材が少ない」、「予算の確保が難しい」などです。", searchKeywords: "中小企業 DX 課題"},
            {category: "ビジネス・DXフレームワーク", question: "DXを推進する基盤となるITシステムに、特に求められる主要な3つの要素を挙げてください。", answer: "①データをリアルタイム等使いたい形で使えるか（データ活用）、②変化に迅速に対応できるデリバリースピードを実現できるか（スピード・アジリティ）、③データを部門を超えて全社最適で活用できるか（全体最適）の3つです。", searchKeywords: "DX ITシステム 3要素"},

            // 準公共分野DX (17問)
            {category: "準公共分野DX", question: "準公共分野とは何ですか。またその特徴を説明してください。", answer: "国民生活に密接に関連し、国と民間が協働して支えている分野のことです。健康・医療・介護、教育、防災、こども、モビリティ、農業・水産業など8分野が指定されています。", searchKeywords: "準公共分野 デジタル化 8分野"},
            {category: "準公共分野DX", question: "GIGAスクール構想とは何ですか。", answer: "児童生徒1人1台端末と高速大容量の通信ネットワークを一体的に整備し、多様な子供たちを誰一人取り残すことなく、個別最適な学びと協働的な学びを実現する教育のDX推進構想です。", searchKeywords: "GIGAスクール構想 1人1台端末"},
            {category: "準公共分野DX", question: "データヘルス改革において実現を目指している主な取り組みを2つ挙げてください。", answer: "スマートフォンで薬剤情報や特定健診情報の確認を可能にすること、電子カルテ情報等の標準化や全国的な情報閲覧基盤の検討などです。", searchKeywords: "データヘルス改革 電子カルテ"},
            {category: "準公共分野DX", question: "学習eポータルとは何ですか。", answer: "学習管理システム（LMS）の機能を持ち、様々なデジタル教材や学習ツールを一元的に管理・利用できるプラットフォームのことです。", searchKeywords: "学習eポータル LMS 教育DX"},
            {category: "準公共分野DX", question: "マイナポータルとは何ですか。", answer: "マイナンバーカードを活用して、行政サービスをオンラインで利用できる政府の運営するウェブサービスです。各種申請や通知の確認、自分の個人情報がどのように使われたか確認できます。", searchKeywords: "マイナポータル 行政サービス オンライン"},
            {category: "準公共分野DX", question: "オンライン診療の推進にあたって重要な課題は何ですか。", answer: "情報セキュリティの確保、医療の質の担保、医師と患者間の信頼関係の構築、遠隔医療に適した疾患の選定などが課題です。", searchKeywords: "オンライン診療 遠隔医療 課題"},
            {category: "準公共分野DX", question: "デジタル教科書とは何ですか。", answer: "紙の教科書の内容をデジタル化し、タブレット端末などで利用できるようにしたものです。動画や音声などマルチメディア機能を活用した学習が可能です。", searchKeywords: "デジタル教科書 タブレット学習"},
            {category: "準公共分野DX", question: "医療DXにおける電子カルテの標準化の目的は何ですか。", answer: "医療機関間でのデータ共有を円滑にし、患者の医療情報を切れ目なく活用できるようにすることで、医療の質の向上と効率化を図ることです。", searchKeywords: "電子カルテ 標準化 医療DX"},
            {category: "準公共分野DX", question: "防災DXにおいて重要な要素を2つ挙げてください。", answer: "リアルタイムでの災害情報の収集・分析・配信、AIやビッグデータを活用した被害予測と避難計画の最適化などです。", searchKeywords: "防災DX AI ビッグデータ"},
            {category: "準公共分野DX", question: "教育データの標準化によって期待される効果は何ですか。", answer: "学習履歴データを蓄積・分析することで、個々の児童生徒の学習状況に応じた最適な指導が可能になり、教育の質の向上が期待されます。", searchKeywords: "教育データ 標準化 学習履歴"},
            {category: "準公共分野DX", question: "PHR（Personal Health Record）とは何ですか。", answer: "個人が自分自身の健康・医療・介護に関する情報を一元的に管理し、必要に応じて医療機関等と共有できる仕組みのことです。", searchKeywords: "PHR Personal Health Record"},
            {category: "準公共分野DX", question: "遠隔教育の利点を2つ挙げてください。", answer: "地理的な制約を超えて質の高い教育を提供できること、多様な学習ニーズに対応した個別最適な学びを実現できることなどです。", searchKeywords: "遠隔教育 オンライン学習 メリット"},
            {category: "準公共分野DX", question: "医療情報の標準規格であるHL7 FHIRとは何ですか。", answer: "Fast Healthcare Interoperability Resourcesの略で、医療情報システム間でのデータ交換を容易にする国際標準規格です。", searchKeywords: "HL7 FHIR 医療情報 標準規格"},
            {category: "準公共分野DX", question: "CBT（Computer Based Testing）とは何ですか。", answer: "コンピュータを使用して実施する試験のことです。紙の試験に比べて、採点の自動化や即座のフィードバックが可能になります。", searchKeywords: "CBT Computer Based Testing"},
            {category: "準公共分野DX", question: "介護DXにおいて期待される効果を2つ挙げてください。", answer: "介護記録のデジタル化による業務効率化、センサーやAIを活用した見守りシステムによる介護の質の向上などです。", searchKeywords: "介護DX デジタル化 見守りシステム"},
            {category: "準公共分野DX", question: "スマート農業とは何ですか。", answer: "IoT、AI、ロボット技術などを活用して、農業の生産性向上や労働力不足の解消を図る取り組みのことです。", searchKeywords: "スマート農業 IoT AI"},
            {category: "準公共分野DX", question: "デジタル・シティズンシップ教育とは何ですか。", answer: "情報技術の利便性を享受しながら、情報社会に主体的に参画し、責任ある行動をとるために必要な資質・能力を育成する教育のことです。", searchKeywords: "デジタルシティズンシップ 情報モラル教育"},

            // 情報セキュリティ (16問)
            {category: "情報セキュリティ", question: "ITパスポート試験とはどのような試験ですか。", answer: "情報処理の促進に関する法律に基づく国家試験で、ITを利活用する全ての社会人・学生が備えておくべきITに関する基礎的な知識を問う試験です。", searchKeywords: "ITパスポート試験 国家試験 IPA"},
            {category: "情報セキュリティ", question: "フィッシング詐欺とは何ですか。また、その対策を2つ挙げてください。", answer: "実在する企業や組織を装ったメールやウェブサイトで個人情報を盗み取る詐欺のことです。対策として、不審なメールのリンクをクリックしない、URLをよく確認する、二段階認証を設定するなどがあります。", searchKeywords: "フィッシング詐欺 対策 セキュリティ"},
            {category: "情報セキュリティ", question: "ランサムウェアとは何ですか。", answer: "コンピュータをロックしたり、ファイルを暗号化したりして使用不能にし、元に戻すことと引き換えに身代金を要求する不正プログラムのことです。", searchKeywords: "ランサムウェア マルウェア 身代金"},
            {category: "情報セキュリティ", question: "強固なパスワードの条件を3つ挙げてください。", answer: "十分な長さがある（12文字以上推奨）、英数字と記号を組み合わせる、辞書に載っている単語や個人情報を避ける、サービスごとに異なるパスワードを使用するなどです。", searchKeywords: "パスワード セキュリティ 強度"},

        let currentIndex = 0;
        let filteredCards = [...flashcards];
        let currentFilter = 'all';

        function displayCard() {
            const card = filteredCards[currentIndex];
            document.getElementById('question').textContent = card.question;
            document.getElementById('answer').textContent = card.answer;
            document.getElementById('category-front').textContent = card.category;
            document.getElementById('category-back').textContent = card.category;
            document.getElementById('card-number-front').textContent = `${currentIndex + 1}/${filteredCards.length}`;
            document.getElementById('card-number-back').textContent = `${currentIndex + 1}/${filteredCards.length}`;
            document.getElementById('current-card').textContent = currentIndex + 1;
            document.getElementById('total-cards').textContent = filteredCards.length;

            // Update Google search link
            const searchLink = document.getElementById('search-link');
            const searchQuery = encodeURIComponent(card.searchKeywords);
            searchLink.href = `https://www.google.com/search?q=${searchQuery}`;

            // Reset flip state
            document.getElementById('flashcard').classList.remove('flipped');

            // Update progress bar
            const progress = ((currentIndex + 1) / filteredCards.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }

        function flipCard(event) {
            // Don't flip if clicking on the search button
            if (event && event.target.closest('.search-button')) {
                return;
            }
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredCards.length;
            displayCard();
        }

        function previousCard() {
            currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
            displayCard();
        }

        function randomCard() {
            currentIndex = Math.floor(Math.random() * filteredCards.length);
            displayCard();
        }

        function filterCategory(category) {
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter cards
            if (category === 'all') {
                filteredCards = [...flashcards];
                currentFilter = 'all';
                document.getElementById('current-category').textContent = '全て';
            } else {
                filteredCards = flashcards.filter(card => card.category === category);
                currentFilter = category;
                document.getElementById('current-category').textContent = category;
            }

            currentIndex = 0;
            displayCard();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
            if (e.key === 'r' || e.key === 'R') randomCard();
        });

        // Initialize
        displayCard();
    </script>
