<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタル社会・DX フラッシュカード</title>

    <!-- OGP Meta Tags -->

    <meta property="og:description" content="DXアドバイザー検定対策に最適な学習用フラッシュカード。デジタル社会、行政DX、データ活用、ビジネスフレームワーク、セキュリティなど多数の問題を収録。カテゴリ別フィルター、ランダム出題機能付き。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://koba5884.github.io/dx_flashcards/">
    <meta property="og:site_name" content="DX Flashcards">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:image" content="https://koba5884.github.io/dx_flashcards/dx_flashcards_ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="デジタル社会・DX フラッシュカード">
    <meta name="twitter:description" content="DXアドバイザー検定対策に最適な学習用フラッシュカード。デジタル社会、行政DX、データ活用、ビジネスフレームワーク、セキュリティなど多数の問題を収録。">
    <meta name="twitter:image" content="https://koba5884.github.io/dx_flashcards/dx_flashcards_ogp.png">

    <!-- Additional Meta Tags -->
    <meta name="description" content="DXアドバイザー検定対策に最適な学習用フラッシュカード。デジタル社会、行政DX、データ活用、ビジネスフレームワーク、セキュリティなど多数の問題を収録。">
    <meta name="keywords" content="DX,デジタルトランスフォーメーション,DXアドバイザー,フラッシュカード,学習,デジタル社会,行政DX,情報セキュリティ">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            width: 100%;
            height: 450px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-front {
            background: white;
        }

        .card-back {
            background: #f8f9fa;
            transform: rotateY(180deg);
        }

        .card-category {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .card-number {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #999;
            font-size: 0.9em;
            font-weight: 600;
        }

        .card-content {
            text-align: center;
            width: 100%;
            overflow-y: auto;
            max-height: 280px;
        }

        .card-front .card-content {
            font-size: 1.2em;
            line-height: 1.6;
            color: #333;
            font-weight: 500;
        }

        .card-back .card-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #555;
            text-align: left;
        }

        .question-text {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            font-weight: 600;
        }

        .choices {
            width: 100%;
            text-align: left;
        }

        .choice-item {
            margin: 12px 0;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-item:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .answer-section {
            width: 100%;
        }

        .correct-answer {
            background: #d4edda;
            border: 2px solid #28a745;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #155724;
        }

        .explanation {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .search-button-container {
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .search-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
        }

        .search-button::before {
            content: "🔍";
            font-size: 1.1em;
        }

        .flip-hint {
            position: absolute;
            bottom: 20px;
            color: #999;
            font-size: 0.85em;
        }

        .card-back .flip-hint {
            bottom: 70px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            font-size: 0.9em;
            background: rgba(255,255,255,0.3);
            color: white;
            backdrop-filter: blur(10px);
        }

        .filter-btn.active {
            background: white;
            color: #667eea;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(102,126,234,0.5);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .card {
                height: 400px;
            }

            .card-face {
                padding: 30px;
            }

            .card-front .card-content {
                font-size: 1.1em;
            }

            .card-back .card-content {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>デジタル社会・DX フラッシュカード</h1>
            <div class="stats">
                <div class="stat-item">全<span id="total-cards">100</span>問</div>
                <div class="stat-item">進捗: <span id="current-card">1</span>問目</div>
                <div class="stat-item">カテゴリ: <span id="current-category">全て</span></div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCategory('all')">全て</button>
            <button class="filter-btn" onclick="filterCategory('デジタル社会・行政DX')">デジタル社会</button>
            <button class="filter-btn" onclick="filterCategory('データ活用・法制度')">データ・法制度</button>
            <button class="filter-btn" onclick="filterCategory('ビジネス・DXフレームワーク')">ビジネス・DX</button>
            <button class="filter-btn" onclick="filterCategory('準公共分野DX')">準公共DX</button>
            <button class="filter-btn" onclick="filterCategory('情報セキュリティ')">セキュリティ</button>
        </div>

        <div class="card-container">
            <div class="card" id="flashcard" onclick="flipCard(event)">
                <div class="card-face card-front">
                    <div class="card-category" id="category-front"></div>
                    <div class="card-number" id="card-number-front"></div>
                    <div class="card-content">
                        <div class="question-text" id="question"></div>
                        <div class="choices" id="choices"></div>
                    </div>
                    <div class="flip-hint">クリックして答えを表示</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-category" id="category-back"></div>
                    <div class="card-number" id="card-number-back"></div>
                    <div class="card-content">
                        <div class="answer-section">
                            <div class="correct-answer" id="correct-answer"></div>
                            <div class="explanation" id="explanation"></div>
                        </div>
                    </div>
                    <div class="search-button-container">
                        <a id="search-link" class="search-button" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
                            さらに調べる
                        </a>
                    </div>
                    <div class="flip-hint">クリックして問題に戻る</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="previousCard()">← 前へ</button>
            <button class="primary" onclick="randomCard()">ランダム</button>
            <button onclick="nextCard()">次へ →</button>
        </div>
    </div>

    <script>
        let flashcards = [];

        // JSONファイルから問題を読み込む
        async function loadQuestions() {
            const categories = [
                'digital-society',
                'data-utilization',
                'business-dx',
                'quasi-public',
                'security'
            ];

            const allQuestions = [];

            for (const category of categories) {
                try {
                    const response = await fetch(`./data/${category}.json`);
                    if (!response.ok) {
                        throw new Error(`${category}.json の読み込みに失敗しました`);
                    }
                    const questions = await response.json();
                    allQuestions.push(...questions);
                } catch (error) {
                    console.error(`エラー: ${category}.json`, error);
                }
            }

            return allQuestions;
        }


        let currentIndex = 0;
        let filteredCards = [...flashcards];
        let currentFilter = 'all';

        function displayCard() {
            const card = filteredCards[currentIndex];

            // Display question
            document.getElementById('question').textContent = card.question;

            // Display choices
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            card.choices.forEach((choice, index) => {
                const choiceItem = document.createElement('div');
                choiceItem.className = 'choice-item';
                choiceItem.textContent = `${index + 1}. ${choice}`;
                choicesDiv.appendChild(choiceItem);
            });

            // Display correct answer
            document.getElementById('correct-answer').textContent = `正解: ${card.choices[card.correctAnswer]}`;

            // Display explanation
            document.getElementById('explanation').textContent = card.explanation;

            // Update category and card numbers
            document.getElementById('category-front').textContent = card.category;
            document.getElementById('category-back').textContent = card.category;
            document.getElementById('card-number-front').textContent = `${currentIndex + 1}/${filteredCards.length}`;
            document.getElementById('card-number-back').textContent = `${currentIndex + 1}/${filteredCards.length}`;
            document.getElementById('current-card').textContent = currentIndex + 1;
            document.getElementById('total-cards').textContent = filteredCards.length;

            // Update Google search link
            const searchLink = document.getElementById('search-link');
            const searchQuery = encodeURIComponent(card.searchKeywords);
            searchLink.href = `https://www.google.com/search?q=${searchQuery}`;

            // Reset flip state
            document.getElementById('flashcard').classList.remove('flipped');

            // Update progress bar
            const progress = ((currentIndex + 1) / filteredCards.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }

        function flipCard(event) {
            // Don't flip if clicking on the search button
            if (event && event.target.closest('.search-button')) {
                return;
            }
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredCards.length;
            displayCard();
        }

        function previousCard() {
            currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
            displayCard();
        }

        function randomCard() {
            currentIndex = Math.floor(Math.random() * filteredCards.length);
            displayCard();
        }

        function filterCategory(category) {
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter cards
            if (category === 'all') {
                filteredCards = [...flashcards];
                currentFilter = 'all';
                document.getElementById('current-category').textContent = '全て';
            } else {
                filteredCards = flashcards.filter(card => card.category === category);
                currentFilter = category;
                document.getElementById('current-category').textContent = category;
            }

            currentIndex = 0;
            displayCard();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
            if (e.key === 'r' || e.key === 'R') randomCard();
        });

        // Initialize - JSONファイルを読み込んでから開始
        (async function() {
            flashcards = await loadQuestions();
            filteredCards = [...flashcards];
            displayCard();
        })();
    </script>
</body>
</html>
